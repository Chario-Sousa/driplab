<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produto — DripLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="imagens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="shop.css">
<link rel="stylesheet" href="comunidade.css">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html"><img src="imagens/marca/logo-driplab.png" width="876" height="216" alt="DripLab"></a>
  <nav class="menu" aria-label="Navegação principal">
    <a href="index.html">Início</a>
    <a class="on" href="shop.html">Shop</a>
    <a href="index.html#drops">Novidades</a>
    <a href="colecoes.html">Coleções</a>
    <a href="comunidade.html">Comunidade</a>
    <a href="sobre.html">Sobre</a>
  </nav>
  <div class="actions">
    <button class="circle" type="button" aria-label="Buscar"><span data-ic="search"></span></button>
    <button class="circle" type="button" aria-label="Perfil"><span data-ic="user"></span></button>
    <button class="circle" type="button" aria-label="Favoritos"><span data-ic="star"></span></button>
    <button class="circle" type="button" aria-label="Carrinho"><span data-ic="cart"></span></button>
  </div>
</header>
<main class="produto-layout" data-produto>
  <a class="produto-voltar" href="shop.html">← Voltar à Shop</a>
  <p data-catalogo-status role="status">Carregando produto...</p>
  <button class="btn sm" type="button" data-tentar-novamente hidden>Tentar novamente</button>

  <article class="produto-detalhe" hidden>
    <div class="produto-foto" data-produto-foto></div>
    <div class="produto-info">
      <p class="eyebrow" data-produto-categoria></p>
      <h1 data-produto-nome></h1>
      <p class="produto-colecao" data-produto-colecao hidden></p>
      <p class="produto-preco" data-produto-preco></p>
      <p class="produto-descricao" data-produto-descricao hidden></p>
      <p class="produto-estado" data-produto-estado></p>
      <div class="produto-acoes">
        <button type="button" class="btn produto-adicionar" disabled><span data-ic="cart"></span> Adicionar ao carrinho</button>
        <button type="button" class="circle favorito-toggle" data-favorito aria-pressed="false" disabled><span data-ic="star"></span></button>
      </div>
      <p class="auth-retorno" role="status" data-favoritos-aviso hidden></p>
    </div>
  </article>
  <section class="votacao-painel comunidade-comentarios" id="comentarios" aria-labelledby="comentarios-titulo" data-comentarios-produto hidden></section>
</main>
<script src="app.js" defer></script>
<script src="catalogo.js" defer></script>
<script type="module" src="comentarios.mjs"></script>
<script src="rodape.js" defer></script>
</body>
</html>
