<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coleções — DripLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="imagens.css">
<link rel="stylesheet" href="app.css">
<style>
.layout{width:min(1420px,94%);margin:1.5rem auto 2rem;display:grid;grid-template-columns:230px minmax(0,1fr);gap:1.4rem;align-items:start}
.side{position:sticky;top:6.5rem;padding:1.2rem;border:1px solid var(--line);border-radius:22px;background:#111}
.side label{display:block;margin-bottom:.5rem;font-size:.86rem;font-weight:600}
.side select{
  width:100%;padding:.65rem .5rem;border:1px solid var(--line);border-radius:8px;
  background:#181818;color:inherit;color-scheme:dark;font:inherit;font-size:.85rem;
}
.banner{
  min-height:210px;padding:1.4rem clamp(1rem,4vw,2.8rem);display:grid;align-content:center;justify-items:start;gap:.65rem;
  border:1px solid var(--line);border-radius:26px;
  background:linear-gradient(90deg,rgba(0,0,0,.94),rgba(0,0,0,.35)),var(--img-banner-colecoes) center/cover,#17100b;
}
.banner h1{font-size:clamp(1.7rem,4vw,3rem)}
.banner p{font-size:.9rem}
.banner .btn[hidden],#colecoes-tentar[hidden]{display:none}
.grid-t{margin:1.6rem 0 1.1rem}
.grid-t h2{font-size:1.15rem;margin-bottom:.4rem}
.grid-t p,.card time{font-size:.8rem;color:var(--muted)}
#colecoes-tentar{margin-bottom:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,225px),1fr));gap:1.1rem}
.card{
  position:relative;isolation:isolate;overflow:hidden;
  min-height:248px;aspect-ratio:1/1.1;padding:1.1rem;display:grid;align-content:end;justify-items:start;gap:.6rem;
  border:1px solid var(--line);border-radius:22px;
  background:var(--img-banner-colecoes) center/cover,#17100b;
}
.card-capa,.card::after{position:absolute;inset:0;width:100%;height:100%}
.card-capa{z-index:-2;object-fit:cover}
.card::after{content:"";z-index:-1;background:linear-gradient(0deg,#080808 4%,rgba(8,8,8,.8) 43%,transparent 79%)}
.card:hover,.card:focus-visible{border-color:var(--orange)}
.card h3{font-family:var(--display);font-size:1rem;overflow-wrap:anywhere}
.card .estado{padding:.15rem .5rem;border:1px solid var(--line);border-radius:999px;font-size:.75rem}
.card[data-estado="em_andamento"] .estado,.card[data-estado="agendado"] .estado{color:var(--orange);border-color:var(--orange)}
.card .btn{margin-top:.15rem}
.nl{margin-top:1.4rem;display:flex;align-items:center;gap:1rem;padding:1rem 1.3rem;border:1px solid var(--line);border-radius:22px;background:rgba(15,15,15,.7);flex-wrap:wrap}
.nl .crown{font-size:2rem;color:var(--orange)}
.nl b{display:block;color:var(--orange);font-size:.85rem;text-transform:uppercase}
.nl small{font-size:.75rem}
.nl form{margin-left:auto;display:flex;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.nl input{min-width:0;background:none;border:0;padding:.7rem .85rem;color:#fff;font:inherit;font-size:.8rem}
.nl button{background:var(--orange);color:#000;border:0;padding:0 .8rem;cursor:pointer;font-weight:500;border-radius:999px}
.nl .social{font-size:1.1rem}
@media(max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr);gap:.85rem}
  .side{position:static;padding:.85rem}
  .banner{min-height:155px}
  .nl form{margin-left:0}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c1-5 15-5 16 0" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3 1.3-6.2L3 9.5l6.3-.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h3l2.5 11h9L20 7H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.4" fill="currentColor"/><circle cx="17" cy="19.5" r="1.4" fill="currentColor"/></symbol>
</svg>

<header class="header">
  <a class="logo" href="index.html"><img src="imagens/marca/logo-driplab.png" width="876" height="216" alt="DripLab"></a>
  <nav class="menu">
    <a href="index.html">Início</a><a href="shop.html">Shop</a><a href="index.html#drops">Novidades</a>
    <a class="on" href="colecoes.html" aria-current="page">Coleções</a>
    <a href="comunidade.html">Comunidade</a><a href="index.html#sobre">Sobre</a>
  </nav>
  <div class="actions">
    <button class="circle" aria-label="Buscar"><svg width="18" height="18"><use href="#i-search"/></svg></button>
    <button class="circle" aria-label="Perfil"><svg width="18" height="18"><use href="#i-user"/></svg></button>
    <button class="circle" aria-label="Favoritos"><svg width="18" height="18"><use href="#i-star"/></svg></button>
    <button class="circle" aria-label="Carrinho"><svg width="18" height="18"><use href="#i-cart"/></svg></button>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <label for="colecoes-filtro">Filtrar por status</label>
    <select id="colecoes-filtro" disabled>
      <option value="">Todos os status</option>
    </select>
  </aside>

  <main>
    <section class="banner" aria-labelledby="colecoes-titulo">
      <h1 id="colecoes-titulo">Coleções</h1>
      <p id="colecoes-destaque" hidden></p>
      <a class="btn sm" id="colecoes-destaque-link" hidden>Ver coleção →</a>
    </section>

    <section aria-labelledby="colecoes-lista-titulo">
      <div class="grid-t">
        <h2 id="colecoes-lista-titulo">Drops do DripLab</h2>
        <p id="colecoes-status" role="status">Carregando coleções…</p>
      </div>
      <button class="btn sm" type="button" id="colecoes-tentar" hidden>Tentar novamente</button>
      <div class="cards" id="cards"></div>
    </section>

    <div class="nl">
      <span class="crown">♛</span>
      <div><b>Receba novidades em primeira mão</b><small>Seja o primeiro a saber sobre os novos lançamentos, drops e coleções exclusivas.</small></div>
      <form onsubmit="event.preventDefault()"><input type="email" placeholder="Seu e-mail" aria-label="Seu e-mail" required><button>INSCREVER</button></form>
      <div class="social"><a href="#" aria-label="Instagram"><img src="imagens/instagram.svg" alt=""></a> <a href="#" aria-label="TikTok"><img src="imagens/tiktok.svg" alt=""></a> <a href="#" aria-label="YouTube"><img src="imagens/youtube.svg" alt=""></a> <a href="#" aria-label="X"><img src="imagens/x.svg" alt=""></a></div>
    </div>
  </main>
</div>

<script type="module" src="colecoes.mjs"></script>
<script src="app.js"></script>
</body>
</html>
