<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — DripLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="imagens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="shop.css">
<link rel="stylesheet" href="comunidade.css">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html"><img src="imagens/marca/logo-driplab.png" width="876" height="216" alt="DripLab"></a>
  <nav class="menu" aria-label="Navegação principal">
    <a href="index.html">Início</a>
    <a class="on" href="shop.html" aria-current="page">Shop</a>
    <a href="index.html#drops">Novidades</a>
    <a href="colecoes.html">Coleções</a>
    <a href="comunidade.html">Comunidade</a>
    <a href="index.html#sobre">Sobre</a>
  </nav>
  <div class="actions">
    <button class="circle" type="button" aria-label="Buscar"><span data-ic="search"></span></button>
    <button class="circle" type="button" aria-label="Perfil"><span data-ic="user"></span></button>
    <button class="circle" type="button" aria-label="Favoritos"><span data-ic="star"></span></button>
    <button class="circle" type="button" aria-label="Carrinho"><span data-ic="cart"></span></button>
  </div>
</header>
<main class="shop-layout" data-shop>
  <h1>Shop</h1>
  <section class="shop-banner" aria-labelledby="titulo-banner">
    <p class="eyebrow">DripLab</p>
    <h2 id="titulo-banner">Coleções</h2>
    <a class="btn sm" href="colecoes.html">Ver coleções <span data-ic="arrow"></span></a>
  </section>

  <aside class="shop-filtros" aria-labelledby="titulo-filtros">
    <h2 id="titulo-filtros">Filtros</h2>
    <form>
      <div>
        <label for="filtro-categoria">Categoria</label>
        <select id="filtro-categoria" name="categoria" disabled><option value="">Todas as categorias</option></select>
      </div>
      <div>
        <label for="filtro-colecao">Coleção</label>
        <select id="filtro-colecao" name="colecao" disabled><option value="">Todas as coleções</option></select>
      </div>
      <button class="shop-limpar" type="reset" disabled>Limpar filtros</button>
    </form>
  </aside>

  <section class="shop-catalogo" aria-labelledby="titulo-catalogo">
    <div class="shop-catalogo-topo">
      <h2 id="titulo-catalogo">Produtos</h2>
      <p data-catalogo-status role="status">Carregando produtos...</p>
      <a class="btn sm" href="#comentarios" data-atalho-comentarios hidden>Comentários do drop</a>
    </div>
    <button class="btn sm" type="button" data-tentar-novamente hidden>Tentar novamente</button>
    <p class="auth-retorno" role="status" data-favoritos-aviso hidden></p>
    <div class="shop-grade" id="produtos-api"></div>
    <section class="votacao-painel comunidade-comentarios" id="comentarios" aria-labelledby="comentarios-titulo" data-comentarios-drop hidden></section>
  </section>
</main>
<script src="app.js" defer></script>
<script src="catalogo.js" defer></script>
<script type="module" src="comentarios.mjs"></script>
</body>
</html>
